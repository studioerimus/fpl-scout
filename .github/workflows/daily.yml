name: FPL Scout daily refresh

on:
  schedule:
    - cron: '0 6 * * *'      # 06:00 UTC (~08:00 your time). Runs on GitHub's servers, laptop off.
  workflow_dispatch: {}       # lets you run it manually from the Actions tab
  push:
    branches: [main]          # also run when code changes (its own daily commit is marked [skip ci])

permissions:
  contents: write             # so it can commit the rebuilt dashboard

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          pip install pulp playwright
          python -m playwright install --with-deps chromium
      - name: Provide odds API key to the run (optional secret)
        run: echo "ODDS_API_KEY=${{ secrets.ODDS_API_KEY }}" >> $GITHUB_ENV
      - name: Fetch FPL + rebuild dashboard
        run: python cloud_refresh.py
      - name: Commit the fresh dashboard
        run: |
          git config user.name  "fpl-scout-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -m "Daily refresh $(date -u +%Y-%m-%d) [skip ci]" || echo "nothing changed"
          git push
      - name: Email it to you (optional — only runs if you add the two mail secrets)
        if: ${{ env.MAIL_USERNAME != '' }}
        continue-on-error: true
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "FPL Scout — daily refresh"
          to: jack@erimus.studio
          from: FPL Scout
          html_body: file://what_changed.md
          attachments: fpl_dashboard.html
